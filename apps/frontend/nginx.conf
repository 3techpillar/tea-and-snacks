server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Serve static files, fallback to index.html for React Router (SPA)
    # This is the ONLY essential block — it prevents 404s on page refresh
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (fonts, images, JS, CSS, sounds)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp3|wav)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
